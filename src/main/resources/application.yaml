logging:
  level:
    io.github.kschafer2.securedocumentplatform: DEBUG

spring:
  application:
    name: secure-document-platform
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:dev/auth/dev-public-key.pem
          audiences:
            - secure-document-platform
  servlet:
    multipart:
      max-file-size: 101MB
      max-request-size: 102MB

storage:
  seaweedfs:
    endpoint: http://localhost:8333
    bucket: ${S3_BUCKET}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: us-east-1